name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-lastest

    steps:
      - uses: action/checkout@v4

      - name: Set up JDK 17
        uses: action/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/action/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

